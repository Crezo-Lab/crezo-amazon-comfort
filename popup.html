<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>Crezo - Amazon Comfort</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f7f6f3;
      --row-hover: #edebe6;
      --line: #d6d3cb;
      --text: #1c1f24;
      --text-sub: #565d68;
      --accent: #b84e00;      /* オン・ロゴ。白地で 4.9:1 */
      --on-accent: #ffffff;
      --track-off: #6b7280;   /* オフの枠線・つまみ。地に対し 3:1 以上 */
      --focus: #0b57d0;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #16191f;
        --row-hover: #1e232b;
        --line: #2f3641;
        --text: #eceff3;
        --text-sub: #a3abb7;
        --accent: #ff9900;
        --on-accent: #16191f;
        --track-off: #8b94a3;
        --focus: #8ab4f8;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 340px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Yu Gothic UI", Meiryo, sans-serif;
      font-size: 14px;
      line-height: 1.5;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 14px 16px 12px;
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .brand-badge {
      flex-shrink: 0;
      background: var(--accent);
      color: var(--on-accent);
      font-weight: 700;
      font-size: 12px;
      line-height: 1;
      padding: 4px 6px;
      border-radius: 3px;
    }

    .title {
      font-size: 15px;
      font-weight: 700;
      overflow-wrap: anywhere;
      text-wrap: balance;
    }

    .version-tag {
      flex-shrink: 0;
      font-size: 12px;
      color: var(--text-sub);
      font-variant-numeric: tabular-nums;
    }

    .section-title {
      padding: 6px 16px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-sub);
      border-top: 1px solid var(--line);
    }

    /* 行ぜんぶが押せる。行の高さは最低 64px */
    .toggle-card {
      display: block;
      border-top: 1px solid var(--line);
      cursor: pointer;
    }
    .toggle-card:first-of-type { border-top: 0; }

    .toggle-card:hover {
      background: var(--row-hover);
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 64px;
      padding: 12px 16px;
    }

    .toggle-info {
      flex: 1;
      min-width: 0;
    }

    .toggle-title {
      font-weight: 600;
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    .toggle-desc {
      margin-top: 2px;
      font-size: 12px;
      color: var(--text-sub);
      line-height: 1.5;
      overflow-wrap: anywhere;
      text-wrap: pretty;
      line-break: strict;
      word-break: auto-phrase;
    }

    /* スイッチ: オン＝塗り＋つまみが右、オフ＝枠だけ＋つまみが左 */
    .switch {
      position: relative;
      display: block;
      width: 44px;
      height: 26px;
      flex-shrink: 0;
    }

    .switch input {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      margin: 0;
      opacity: 0;
      cursor: pointer;
    }

    .slider {
      position: absolute;
      inset: 0;
      border: 2px solid var(--track-off);
      border-radius: 13px;
      background: transparent;
      transition: background-color 0.2s ease, border-color 0.2s ease;
      pointer-events: none;
    }

    .slider::before {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--track-off);
      transition: transform 0.2s ease, background-color 0.2s ease;
    }

    input:checked + .slider {
      background: var(--accent);
      border-color: var(--accent);
    }

    input:checked + .slider::before {
      transform: translateX(18px);
      background: var(--on-accent);
    }

    input:focus-visible + .slider {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }

    .footer {
      padding: 10px 16px 12px;
      border-top: 1px solid var(--line);
      text-align: center;
      font-size: 12px;
      color: var(--text-sub);
    }

    @media (prefers-reduced-motion: reduce) {
      .slider, .slider::before { transition: none; }
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo-container">
      <span class="brand-badge">Crezo</span>
      <span class="title">Amazon 快適化</span>
    </div>
    <span class="version-tag">v1.0.1</span>
  </div>

  <div class="section-title">買い物フィルター</div>

  <label class="toggle-card">
    <div class="toggle-row">
      <div class="toggle-info">
        <div class="toggle-title">Amazon公式販売のみ</div>
        <div class="toggle-desc">転売業者や怪しい出品者を一括除外（公式販売・発送のみ表示）</div>
      </div>
      <span class="switch">
        <input type="checkbox" id="official-only">
        <span class="slider"></span>
      </span>
    </div>
  </label>

  <label class="toggle-card">
    <div class="toggle-row">
      <div class="toggle-info">
        <div class="toggle-title">自動スクロール</div>
        <div class="toggle-desc">ページ最下部へスクロールすると自動で次の検索結果を読み込みます</div>
      </div>
      <span class="switch">
        <input type="checkbox" id="infinite-scroll">
        <span class="slider"></span>
      </span>
    </div>
  </label>

  <div class="footer">
    <span>© 2026 Crezo Lab</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
